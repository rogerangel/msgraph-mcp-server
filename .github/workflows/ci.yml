name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore GraphMcp.slnx --locked-mode
      - run: dotnet build GraphMcp.slnx --no-restore -c Release
      - run: dotnet test --solution GraphMcp.slnx --no-build -c Release
      - run: docker build --tag graph-mcp:ci .
